# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-aeld"
BBFILE_PATTERN_meta-aeld = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-aeld = "7"

LAYERDEPENDS_meta-aeld = "core"
LAYERSERIES_COMPAT_meta-aeld = "hardknott kirkstone"
